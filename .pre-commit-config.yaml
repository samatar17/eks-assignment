repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform Format Check
        entry: terraform
        args: [fmt, -check, -recursive, terraform]
        language: system
        pass_filenames: false
        always_run: true

      - id: terraform-validate
        name: Terraform Validate
        entry: terraform
        args: [-chdir=terraform, validate]
        language: system
        pass_filenames: false
        always_run: true

      - id: checkov
        name: Checkov Terraform Security Scan
        entry: checkov
        args: [-d, terraform, --framework, terraform, --quiet]
        language: system
        pass_filenames: false
        files: '\.tf$'
        always_run: true
