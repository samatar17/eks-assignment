apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-web-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.aws.samatar.co.uk
      secretName: sample-web-tls
  rules:
    - host: app.aws.samatar.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-web-service
                port:
                  number: 80